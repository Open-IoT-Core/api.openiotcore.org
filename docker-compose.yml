version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: openiotcore_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cambia_esto
      POSTGRES_DB: control_acceso_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend_api:
    build: .
    container_name: openiotcore_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DB_HOST: postgres_db
      DB_USER: postgres
      DB_PASSWORD: cambia_esto
      DB_NAME: control_acceso_db
      PORT: 4000
    depends_on:
      - postgres_db

volumes:
  pgdata:
